<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide des villes de France</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fa;--sf:#fff;--tx:#1d2740;--mu:#5d6882;--ln:#dde1ea;--ac:#2a58a6;--ok:#23704f;--no:#a93a28;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--sf:#192038;--tx:#e8ecf6;--mu:#9aa6c4;--ln:#2b3454;--ac:#7fa6ee;--ok:#5dc596;--no:#f08a77;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10162a;--sf:#192038;--tx:#e8ecf6;--mu:#9aa6c4;--ln:#2b3454;--ac:#7fa6ee;--ok:#5dc596;--no:#f08a77;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 1.7rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input{flex:1 1 220px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:230px 1fr;gap:20px}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:4px;max-height:560px;overflow-y:auto}
@media (max-width:700px){.list{flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;padding-bottom:6px}}
.city{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:9px 12px;text-align:left;font:inherit;cursor:pointer;white-space:nowrap}
.city small{display:block;color:var(--mu);font-size:.78rem}
.city[aria-current="true"]{border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.detail{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:22px}
.detail h2{font:700 2.4rem/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 4px}
.reg{color:var(--mu);margin:0 0 10px}
.lead{font-size:1.1rem;margin:0 0 4px;max-width:60ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
h3{margin:0 0 8px;font-size:1rem}
.do h3{color:var(--ok)}.dont h3{color:var(--no)}
ul{margin:0;padding-left:18px}li{margin-bottom:6px}
.tip{margin-top:18px;padding-top:14px;border-top:1px solid var(--ln);color:var(--mu);font-size:.95rem}
.empty{color:var(--mu);padding:12px}.hero{background:linear-gradient(120deg,#2a58a6,#5b7fd0 55%,#d6483a);border-radius:16px;padding:22px;margin-bottom:18px}.hero h1,.hero .sub{color:#fff}.hero .sub{margin:0}
.do{background:color-mix(in srgb,var(--ok) 13%,var(--sf));padding:14px;border-radius:10px}.dont{background:color-mix(in srgb,var(--no) 13%,var(--sf));padding:14px;border-radius:10px}
.city{border-left:5px solid var(--rc,var(--ln))}.city[aria-current="true"]{background:color-mix(in srgb,var(--rc,var(--ac)) 16%,var(--sf))}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--rc)}
.detail{border-top:6px solid var(--rc,var(--ac))}
.th{float:left;width:40px;height:40px;object-fit:cover;border-radius:6px;margin:0 10px 0 -4px}.city{overflow:hidden}.gal a{display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:14px 0 0}.gal img{width:100%;height:100px;object-fit:cover;border-radius:8px}
#wk img:not(.gal img){margin-bottom:14px}
#wk img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:14px;display:block}.wk{color:var(--mu);font-size:.95rem;max-width:70ch}textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit}a{color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>Guide des villes de France</h1>
<p class="sub">Cherchez parmi toutes les communes de France. Chaque fiche affiche une photo et une présentation tirées de Wikipédia. Les grandes villes ont en plus nos conseils, les autres vous laissent noter les vôtres.</p></div>
<div class="tools"><input id="q" type="search" placeholder="Quelle ville avez-vous en tête ?" aria-label="Rechercher une ville"></div>
<div class="chips" id="chips"></div>
<div class="grid"><div class="list" id="list"></div><article class="detail" id="detail"></article></div>
</div>
<script>
var V=[
{n:"Paris",m:"La ville qu’on croit connaître, et qui surprend toujours dès qu’on quitte les grandes avenues.",r:"Île-de-France",f:["Flâner dans le Marais et au canal Saint-Martin","Monter à Montmartre tôt le matin, avant la foule","Réserver à l’avance les grands musées"],e:["Les restaurants à menu en photos près des monuments","Les pétitions et jeux de rue autour de la tour Eiffel","Laisser téléphone et sac ouverts dans le métro"],t:"Avril à juin et septembre. Le métro reste le plus rapide."},
{n:"Marseille",m:"Solaire, vivante et tournée vers la mer : on y mange bien et on repart avec le sourire.",r:"Provence-Alpes-Côte d’Azur",f:["Se balader au Vieux-Port et au Panier","Marcher dans les calanques, eau et chaussures solides","Goûter une vraie bouillabaisse, sur réservation"],e:["Les calanques en été sans avoir vérifié l’accès (restrictions)","La voiture en centre-ville aux heures de pointe","Les bouillabaisses à prix cassé"],t:"Mai-juin et septembre-octobre, plus calme et moins chaud."},
{n:"Lyon",m:"La capitale de la bonne table, qui se découvre tranquillement, de colline en colline.",r:"Auvergne-Rhône-Alpes",f:["Découvrir les traboules du Vieux-Lyon et de la Croix-Rousse","Dîner dans un bouchon lyonnais","Monter à la basilique de Fourvière pour la vue"],e:["Les bouchons sans réservation le week-end soir","Les menus touristiques de la rue Saint-Jean","Visiter sans billet de transports : tout se fait à pied ou en métro"],t:"Printemps et automne. Fête des Lumières début décembre."},
{n:"Toulouse",m:"La ville rose, douce à vivre, où l’on traîne volontiers sur les quais en fin de journée.",r:"Occitanie",f:["Place du Capitole et basilique Saint-Sernin","Balade sur le canal du Midi","Cité de l’espace en famille"],e:["Marcher en plein après-midi de juillet-août","La voiture dans le centre piéton","Rester uniquement sur la place du Capitole"],t:"Avril-juin et septembre-octobre."},
{n:"Nice",m:"Entre mer et montagne, une ville qui vit dehors presque toute l’année.",r:"Provence-Alpes-Côte d’Azur",f:["Promenade des Anglais à vélo ou à pied","Marché du cours Saleya et Vieille-Ville","Colline du Château au coucher du soleil"],e:["Les plages privées sans regarder les tarifs","Juillet-août si vous craignez la foule","Laisser ses affaires sans surveillance sur la plage"],t:"Mai-juin et septembre. Le tram relie l’aéroport au centre."},
{n:"Nantes",m:"Créative et facile à vivre, avec un goût pour les idées un peu folles.",r:"Pays de la Loire",f:["Les Machines de l’île","Château des ducs de Bretagne","Suivre la ligne verte du Voyage à Nantes"],e:["Compter sur des commerces ouverts partout le dimanche","Se limiter au centre : les bords de l’Erdre valent le détour"],t:"Mai à septembre, été très animé."},
{n:"Strasbourg",m:"Une ville de contes, à mi-chemin entre la France et l’Allemagne.",r:"Grand Est",f:["Petite France et cathédrale Notre-Dame","Tour en bateau sur l’Ill","Goûter flammekueche et choucroute"],e:["Le marché de Noël le week-end (très dense)","Les restaurants sans vérifier les horaires de service","Venir en voiture : privilégier le tram"],t:"Fin novembre-décembre pour la magie, mai-juin pour la tranquillité."},
{n:"Bordeaux",m:"Élégante sans se prendre au sérieux, avec le vignoble à portée de train.",r:"Nouvelle-Aquitaine",f:["Miroir d’eau et quais de la Garonne","Cité du Vin","Excursion à Saint-Émilion, dégustation réservée"],e:["Conduire après une dégustation","Le centre en voiture : zones piétonnes et tram","Arriver sans réservation en haute saison dans les châteaux"],t:"Septembre-octobre pour les vendanges."},
{n:"Lille",m:"Chaleureuse et gourmande, on s’y sent vite comme chez soi.",r:"Hauts-de-France",f:["Vieux-Lille et Grand’Place","Palais des Beaux-Arts","Une gaufre et un welsh sur place"],e:["Venir à la braderie (début septembre) sans loger à l’avance","Garer la voiture en centre : parkings relais conseillés"],t:"Toute l’année. Eurostar et TGV : arrivée en centre-ville."},
{n:"Rennes",m:"Étudiante et vivante, avec des terrasses pleines dès les premiers rayons de soleil.",r:"Bretagne",f:["Place du Parlement et centre médiéval","Parc du Thabor","Les galettes-saucisses au marché des Lices"],e:["La rue Saint-Michel si vous voulez dormir tôt","Penser que la mer est à côté : Saint-Malo est à 1 h"],t:"Juin à septembre."},
{n:"Montpellier",m:"Jeune et ensoleillée, avec la mer à quelques stations de tram.",r:"Occitanie",f:["L’Écusson à pied","Promenade du Peyrou","Plages de Palavas en tram et bus"],e:["La voiture dans l’Écusson","Les heures chaudes de l’été sur la place de la Comédie"],t:"Avril-juin et septembre."},
{n:"Dijon",m:"Une ville de gourmands, compacte, parfaite pour un week-end sans stress.",r:"Bourgogne-Franche-Comté",f:["Parcours de la chouette (flèches au sol)","Musée des Beaux-Arts, palais des ducs","Moutarde et vins de Bourgogne"],e:["Y aller sans vérifier les jours de fermeture des musées","Ne rester que le centre : la route des Grands Crus est proche"],t:"Mai à octobre."}
];
var reg="Toutes",cur=0,q="";
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function chips(){var rs=["Toutes"];V.forEach(function(v){if(rs.indexOf(v.r)<0)rs.push(v.r)});
$("chips").innerHTML=rs.map(function(r){return '<button class="chip" style="--rc:'+rc(r)+'" aria-pressed="'+(r===reg)+'" data-r="'+esc(r)+'">'+(r==="Toutes"?"":"<i></i>")+esc(r)+'</button>'}).join("")}
function filt(){return V.filter(function(v){return (reg==="Toutes"||v.r===reg)&&v.n.toLowerCase().indexOf(q)>=0})}
function list(){var f=filt();if(f.length&&f.indexOf(V[cur])<0)cur=V.indexOf(f[0]);
$("list").innerHTML=f.length?f.map(function(v){var i=V.indexOf(v);return '<button class="city" style="--rc:'+rc(v.r)+'" aria-current="'+(i===cur)+'" data-i="'+i+'">'+esc(v.n)+'<small>'+esc(v.r)+'</small></button>'}).join(""):(RH?"":'<div class="empty">Tapez au moins deux lettres pour chercher dans toutes les communes.</div>');
$("list").insertAdjacentHTML("beforeend",RH);thumbs();detail(f.length)}
function detail(ok){var d=$("detail");if(!ok){d.style.display="none";return}d.style.display="";var v=V[cur];d.style.setProperty("--rc",rc(v.r));
var L=function(a){return "<ul>"+a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul>"};
d.innerHTML='<div id="wk"></div><h2>'+esc(v.n)+'</h2><p class="reg">'+esc(v.r)+'</p><p class="lead">'+esc(v.m)+'</p><div class="cols"><div class="do"><h3>Ce qui vaut le détour</h3>'+L(v.f)+'</div><div class="dont"><h3>Mieux vaut éviter</h3>'+L(v.e)+'</div></div><p class="tip"><strong>Le bon moment :</strong> '+esc(v.t)+'</p>';wiki(v.n,"")}
$("q").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();list();remote(q)});
$("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;reg=b.dataset.r;chips();list()});
$("list").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.x!==undefined){showX(+b.dataset.x);return}cur=+b.dataset.i;list()});
var RH="",R=[],tm;
function dn(c){return (c.departement||{}).nom||""}
function remote(s){clearTimeout(tm);if(s.length<2){RH="";R=[];list();return}
tm=setTimeout(function(){fetch("https://geo.api.gouv.fr/communes?fields=nom,code,population,departement,region&boost=population&limit=10&nom="+encodeURIComponent(s)).then(function(r){return r.json()}).then(function(a){R=a;RH=a.map(function(c,i){return '<button class="city" style="--rc:'+rc((c.region||{}).nom||"")+'" data-x="'+i+'">'+esc(c.nom)+'<small>'+esc(dn(c))+' ('+esc(c.code)+')</small></button>'}).join("");list()}).catch(function(){RH='<div class="empty">Impossible de charger la liste complète. Vérifiez votre connexion.</div>';list()})},250)}
function showX(i){var c=R[i],d=$("detail"),k="note-"+c.code,n="";d.style.display="";d.style.setProperty("--rc",rc((c.region||{}).nom||""));try{n=localStorage.getItem(k)||""}catch(e){}
d.innerHTML='<div id="wk"></div><h2>'+esc(c.nom)+'</h2><p class="reg">'+esc(dn(c))+', '+esc((c.region||{}).nom||"")+'</p><p class="lead">'+(c.population?c.population.toLocaleString("fr-FR")+' habitants. ':'')+'Cette fiche n’est pas encore rédigée : notez vos propres conseils ci-dessous.</p><p><a href="https://fr.wikipedia.org/w/index.php?search='+encodeURIComponent(c.nom+' '+dn(c))+'">Lire sur Wikipédia</a> &nbsp; <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.nom+', France')+'">Voir sur la carte</a></p><h3>Mes conseils</h3><textarea id="note" rows="5" placeholder="Ce qu’il faut faire, ce qu’il vaut mieux éviter…">'+esc(n)+'</textarea>';
wiki(c.nom,dn(c));$("note").addEventListener("input",function(e){try{localStorage.setItem(k,e.target.value)}catch(x){}})}
function commons(t,dep,id){fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch="+encodeURIComponent("filetype:bitmap "+t+" "+(dep||"France"))+"&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=400").then(function(r){return r.json()}).then(function(m){var g=$("gc");if(id!==WT||!g)return;
var P=(m.query||{}).pages||{},p=Object.keys(P).map(function(k){return P[k]}).sort(function(a,b){return a.index-b.index});
g.innerHTML=p.filter(function(x){return x.imageinfo&&/\.jpe?g/i.test(x.imageinfo[0].thumburl||"")}).map(function(x){var ii=x.imageinfo[0],md=ii.extmetadata||{},a=((md.Artist||{}).value||"").replace(/<[^>]*>/g,""),l=(md.LicenseShortName||{}).value||"";return '<a href="'+ii.descriptionurl+'" target="_blank" rel="noopener"><img loading="lazy" src="'+ii.thumburl+'" alt="Photo de '+esc(t)+'" title="'+esc((a+" "+l).replace(/"/g,"'"))+'"></a>'}).join("")}).catch(function(){})}
var TC={};
function thumbs(){var bs=document.querySelectorAll(".city[data-i]");for(var k=0;k<bs.length;k++)(function(b){var n=V[+b.dataset.i].n;if(b.querySelector(".th"))return;
function put(u){if(u&&!b.querySelector(".th"))b.insertAdjacentHTML("afterbegin",'<img class="th" alt="" src="'+u+'">')}
if(n in TC){put(TC[n]);return}
fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(n)).then(function(r){return r.json()}).then(function(j){TC[n]=j.thumbnail?j.thumbnail.source:"";put(TC[n])}).catch(function(){TC[n]=""})})(bs[k])}
function rc(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return "hsl("+h+" 58% 48%)"}
function gallery(title,t,id){fetch("https://fr.wikipedia.org/api/rest_v1/page/media-list/"+encodeURIComponent(title.replace(/ /g,"_"))).then(function(r){return r.json()}).then(function(m){var g=$("gl");if(id!==WT||!g)return;
var im=(m.items||[]).filter(function(x){return x.type==="image"&&x.srcset&&x.srcset[0]&&/\.jpe?g/i.test(x.srcset[0].src)}).slice(0,6);
g.innerHTML=im.map(function(x){var u=x.srcset[0].src;return '<img loading="lazy" src="'+(u.indexOf("//")===0?"https:":"")+u+'" alt="Vue de '+esc(t)+'">'}).join("")}).catch(function(){})}
var WT=0;
function wiki(t,dep){var id=++WT;
function go(title,retry){fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_"))).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(id!==WT)return;
if(retry&&dep&&(j.type==="disambiguation"||!/commune/i.test(j.extract||""))){go(t+" ("+dep+")",false);return}
var b=$("wk");if(!b)return;
b.innerHTML=(j.thumbnail?'<img src="'+j.thumbnail.source+'" alt="Photo de '+esc(t)+'" loading="lazy">':'')+'<p class="wk">'+esc(j.extract||"")+' <a href="'+j.content_urls.desktop.page+'">Source : Wikipédia</a></p><div class="gal" id="gl"></div><p class="wk">Plus de photos, via Wikimedia Commons (cliquez pour voir l’auteur et la licence) :</p><div class="gal" id="gc"></div>';gallery(title,t,id);commons(t,dep,id)}).catch(function(){if(retry&&dep&&id===WT)go(t+" ("+dep+")",false)})}
go(t,true)}
chips();list();
</script>
</body>
</html>
